<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Membership Application Form | ACTA</title>
<link rel="icon" type="image/png" href="../assets/acta-logo.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf2;font-family:Arial,Helvetica,sans-serif;color:#000}
.bar{position:sticky;top:0;background:#0b1d3a;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;z-index:5}
.bar button,.bar a{background:#e8b92e;color:#07152d;border:0;border-radius:4px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none}
.bar a.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.msg{max-width:820px;margin:16px auto;padding:12px 16px;border-radius:4px;background:#fdf1d8;color:#6b4600;font-size:14px}
.sheet{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:11mm 11mm 9mm;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.wrap{overflow-x:auto}
header{display:grid;grid-template-columns:30mm 1fr 30mm;align-items:center;text-align:center;padding-bottom:3mm;border-bottom:2.5px solid #000}
header img{width:23mm;height:auto}
header h1{font-family:"Times New Roman",Times,serif;font-size:16pt;margin:0;letter-spacing:.2px}
header .ab{font-family:"Times New Roman",serif;font-size:11pt;font-weight:700;margin:1mm 0}
header .mt{font-size:12pt;font-weight:700;margin:1mm 0 0}
.flag{width:24mm;height:15mm;margin:auto;position:relative;background:linear-gradient(#0038a8 50%,#ce1126 50%);border:1px solid #999}
.flag:before{content:"";position:absolute;left:0;top:0;border-left:13mm solid #fff;border-top:7.5mm solid transparent;border-bottom:7.5mm solid transparent}
.flag:after{content:"";position:absolute;left:2.6mm;top:5.6mm;width:3.8mm;height:3.8mm;border-radius:50%;background:#fcd116}
h2{font-family:"Times New Roman",serif;text-align:center;font-size:13.5pt;margin:2.5mm 0 1.5mm}
table{width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed}
td,th{border:1px solid #000;padding:1mm 1.4mm;vertical-align:middle;height:5.7mm;word-wrap:break-word}
th{background:#e6e6e6;font-weight:400;text-align:left;font-size:7.5pt}
.sec td{font-family:"Times New Roman",serif;font-weight:700;font-size:11pt;background:#fff;height:6mm;border-bottom:0}
.v{font-size:9pt;font-weight:700;font-family:Arial,sans-serif}
.cap td{font-size:6.5pt;text-align:center;height:auto;padding:.4mm;border-top:0}
.ctr{text-align:center}
.photo{width:100%;height:100%;display:grid;place-items:center;font-family:"Times New Roman",serif;font-size:22pt;font-weight:700;color:#999;text-align:center;line-height:1}
.photo small{display:block;font-size:13pt}
.photo img{width:38mm;height:38mm;object-fit:cover}
.box{display:inline-block;width:5mm;height:3.6mm;border:1px solid #000;vertical-align:middle;margin-right:1.5mm;text-align:center;line-height:3.4mm;font-size:8pt;font-weight:700}
.sig{height:13mm;vertical-align:bottom;text-align:center;font-size:7.5pt}
.line{border-top:1px solid #000;margin:0 6mm;padding-top:1mm;font-weight:700;font-family:"Times New Roman",serif;font-size:10pt}
.note{font-size:7pt;color:#444;margin-top:2mm;display:flex;justify-content:space-between;gap:10px}
@media print{body{background:#fff}.bar,.msg{display:none}.sheet{margin:0;box-shadow:none;width:auto;min-height:0;padding:0}@page{size:A4;margin:8mm}th{-webkit-print-color-adjust:exact;print-color-adjust:exact}.flag{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="bar"><span id="bar-text">ACTA Membership Application Form</span><span style="display:flex;gap:8px"><a class="alt" href="./" id="back">Back to portal</a><button onclick="window.print()">Print / Save as PDF</button></span></div>
<div id="msg"></div>
<div class="wrap"><div class="sheet" id="sheet"></div></div>

<script type="module">
import { CIVIL, MAX_CHILDREN, age } from "./appform.js?v=5";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = d => { if (!d) return ""; const x = d.toDate ? d.toDate() : new Date(d); return isNaN(x) ? esc(d) : x.toLocaleDateString("en-PH", { year: "numeric", month: "long", day: "numeric" }); };

function render(a = {}) {
  const V = k => `<span class="v">${esc(a[k] || "")}</span>`;
  const kids = (a.children || []).slice(0, MAX_CHILDREN);
  while (kids.length < 5) kids.push({});
  const civ = c => `<span class="box">${a.civilStatus === c ? "✓" : ""}</span>${c.toUpperCase()}`;
  const end = a.endorsedBy ? `Endorsed online by ${esc(a.endorsedBy)} · ${fmt(a.endorsedAt)}` : "";
  const appr = a.status === "approved" && a.decidedBy ? `Approved online by ${esc(a.decidedBy)} · ${fmt(a.decidedAt)}` : "";
  $("#sheet").innerHTML = `
  <header><img src="../assets/acta-logo.png" alt="ACTA logo"><div><h1>ANTI CRIME and TRAFFIC ASSISTANCE</h1><div class="ab">(ACTA)</div><div class="mt">"Always Committed To Assist"</div><div class="mt">Force Multiplier</div></div><div class="flag" aria-hidden="true"></div></header>
  <h2>MEMBERSHIP APPLICATION FORM</h2>
  <table>
    <colgroup><col style="width:16%"><col style="width:13%"><col style="width:10%"><col style="width:11%"><col style="width:13%"><col style="width:13%"><col style="width:24%"></colgroup>
    <tr class="sec"><td colspan="6">PERSONAL INFORMATION:</td><td rowspan="7" style="padding:0">${a.photo ? `<div class="photo"><img src="${esc(a.photo)}" alt=""></div>` : `<div class="photo"><div>2 X 2<small>PHOTO</small></div></div>`}</td></tr>
    <tr><th rowspan="2">NAME</th><td colspan="2">${V("firstName")}</td><td>${V("nickname")}</td><td>${V("middleName")}</td><td>${V("lastName")}</td></tr>
    <tr class="cap"><td colspan="2">FIRST NAME</td><td>(NICKNAME)</td><td>MIDDLE</td><td>LAST NAME</td></tr>
    <tr><th>PLACE OF BIRTH</th><td colspan="3">${V("birthPlace")}</td><td colspan="2" class="ctr" style="font-weight:700;font-size:7.5pt">CIVIL STATUS</td></tr>
    <tr><th>DATE OF BIRTH</th><td colspan="3"><span class="v">${fmt(a.birthdate)}</span></td><td style="font-size:7pt">${civ(CIVIL[0])}</td><td style="font-size:7pt">${civ(CIVIL[1])}</td></tr>
    <tr><th>HEIGHT</th><td>${V("height")}</td><th>WEIGHT</th><td>${V("weight")}</td><td style="font-size:7pt">${civ(CIVIL[2])}</td><td style="font-size:7pt">${civ(CIVIL[3])}</td></tr>
    <tr><th>CITIZENSHIP</th><td>${V("citizenship")}</td><th>RELIGION</th><td>${V("religion")}</td><th>BLOOD TYPE</th><td>${V("bloodType")}</td></tr>
  </table>
  <table>
    <colgroup><col style="width:17%"><col><col><col><col><col style="width:12%"></colgroup>
    <tr><th rowspan="2">ADDRESS</th><td>${V("street")}</td><td>${V("barangay")}</td><td>${V("city")}</td><td>${V("province")}</td><td>${V("zip")}</td></tr>
    <tr class="cap"><td>STREET NO.</td><td>BARANGAY</td><td>MUNICIPALITY/CITY</td><td>PROVINCE</td><td>ZIP CODE</td></tr>
  </table>
  <table>
    <colgroup><col style="width:17%"><col style="width:18%"><col style="width:12%"><col style="width:20%"><col style="width:8%"><col></colgroup>
    <tr><th>TELEPHONE NO.</th><td>${V("telephone")}</td><th>CELLPHONE NO.</th><td>${V("phone")}</td><th>EMAIL</th><td>${V("email")}</td></tr>
    <tr><th>PREFERRED CHAPTER</th><td colspan="5">${V("chapter")}</td></tr>
  </table>
  <table>
    <colgroup><col style="width:17%"><col style="width:35%"><col style="width:9%"><col style="width:16%"><col style="width:8%"><col></colgroup>
    <tr class="sec"><td colspan="6">EMPLOYMENT / PROFESSION:</td></tr>
    <tr><th>NAME OF OFFICE<br>LINE OF BUSINESS</th><td>${V("employer")}</td><th>ADDRESS</th><td colspan="3">${V("employerAddress")}</td></tr>
    <tr><th>TITLE AND POSITION</th><td>${V("jobTitle")}</td><th>TEL. NO.</th><td>${V("workTel")}</td><th>FAX NO.</th><td>${V("workFax")}</td></tr>
  </table>
  <table>
    <colgroup><col style="width:12%"><col style="width:46%"><col style="width:28%"><col></colgroup>
    <tr class="sec"><td colspan="4">LIST OF LEGAL DEPENDENTS:</td></tr>
    <tr><th></th><th class="ctr">NAME</th><th class="ctr">DATE OF BIRTH</th><th class="ctr">AGE</th></tr>
    <tr><th>SPOUSE NAME</th><td>${V("spouseName")}</td><td class="ctr"><span class="v">${fmt(a.spouseBirthdate)}</span></td><td class="ctr"><span class="v">${age(a.spouseBirthdate)}</span></td></tr>
    ${kids.map((c, i) => `<tr>${i === 0 ? `<th rowspan="${kids.length}" class="ctr">NAME OF<br>CHILDREN</th>` : ""}<td><span class="v">${esc(c.name || "")}</span></td><td class="ctr"><span class="v">${fmt(c.birthdate)}</span></td><td class="ctr"><span class="v">${age(c.birthdate)}</span></td></tr>`).join("")}
  </table>
  <table>
    <colgroup><col style="width:15%"><col style="width:52%"><col style="width:15%"><col></colgroup>
    <tr class="sec"><td colspan="4">EDUCATIONAL ATTAINMENT:</td></tr>
    <tr><th>ELEMENTARY</th><td>${V("elementary")}</td><th>DATE GRADUATED</th><td>${V("elementaryYear")}</td></tr>
    <tr><th>HIGH SCHOOL</th><td>${V("highSchool")}</td><th>DATE GRADUATED</th><td>${V("highSchoolYear")}</td></tr>
    <tr><th>COLLEGE</th><td>${V("college")}</td><th>DATE GRADUATED</th><td>${V("collegeYear")}</td></tr>
    <tr><th>COURSE</th><td colspan="3">${V("course")}</td></tr>
    <tr><th>HOBBIES</th><td colspan="3">${V("hobbies")}</td></tr>
    <tr><th>SPECIAL SKILLS</th><td colspan="3">${V("skills")}</td></tr>
  </table>
  <table>
    <colgroup><col style="width:30%"><col style="width:16%"><col style="width:22%"><col></colgroup>
    <tr class="sec"><td colspan="3">SPONSOR:</td><td rowspan="3" class="sig"><div class="line" style="font-family:Arial;font-weight:400;font-size:7.5pt">APPLICANT'S SIGNATURE</div></td></tr>
    <tr><th class="ctr">NAME</th><th class="ctr">DATE</th><th class="ctr">SIGNATURE</th></tr>
    <tr style="height:9mm"><td>${V("sponsorName")}</td><td></td><td></td></tr>
  </table>
  <table>
    <tr><td colspan="2" class="ctr" style="border-bottom:0;font-size:7.5pt;height:5mm">ENDORSED BY:</td></tr>
    <tr><td class="sig" style="border-top:0;border-right:0"><div style="font-size:7pt;color:#444;margin-bottom:1mm">${end}</div><div class="line" style="text-decoration:underline">Membership Coordinator.</div></td><td class="sig" style="border-top:0;border-left:0"><div class="line">Founder/ /President</div></td></tr>
    <tr><td class="sig" style="height:17mm;vertical-align:top;text-align:left">CONCURRED BY:<div style="height:7mm"></div><div class="line" style="font-weight:400"></div></td><td class="sig" style="height:17mm;vertical-align:top;text-align:left">APPROVED BY:<div style="font-size:7pt;color:#444;height:7mm;padding-top:2mm">${appr}</div><div class="line" style="font-weight:400"></div></td></tr>
  </table>
  <div class="note"><span>${a.createdAt ? `Submitted online ${fmt(a.createdAt)}${a.consent ? " · Applicant certified the information and consented under RA 10173" : ""}` : "ACTA Membership Application Form"}</span><span>actaph.github.io/members</span></div>`;
}

const id = new URLSearchParams(location.search).get("id");
if (!id) { render(); }
else {
  render();
  $("#bar-text").textContent = "Loading application…"; $("#back").href = "admin.html";
  try {
    const { configured, auth, db, fb } = await import("./portal.js?v=5");
    if (!configured) throw new Error("The portal isn't connected yet.");
    fb.onAuthStateChanged(auth, async user => {
      if (!user) { location.replace("login.html"); return; }
      try {
        const snap = await fb.getDoc(fb.doc(db, "applications", id));
        if (!snap.exists()) throw new Error("Application not found.");
        const a = snap.data(); render(a);
        const name = [a.firstName, a.lastName].filter(Boolean).join(" ");
        $("#bar-text").textContent = `Application — ${name}`; document.title = `Application — ${name} | ACTA`;
      } catch (e) { $("#msg").innerHTML = `<div class="msg">${esc(e.code === "permission-denied" ? "Only ACTA portal admins can open submitted applications." : e.message)}</div>`; $("#bar-text").textContent = "ACTA Membership Application Form"; }
    });
  } catch (e) { $("#msg").innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
}
</script>
</body>
</html>
